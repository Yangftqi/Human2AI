name: Release Dual-Platform Artifacts

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag label (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows x64 Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies & test
        run: |
          pnpm install --frozen-lockfile
          pnpm test -- --run

      - name: Build Tauri Windows binary
        run: pnpm tauri build --no-bundle

      - name: Package portable zip
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $stage = "release-win-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/human2ai.exe" $stage
          $wv2 = Get-ChildItem "src-tauri/target/release/build" -Recurse -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          if ($wv2) { Copy-Item $wv2.FullName $stage }
          foreach ($f in @("LICENSE", "LICENSE-ASSETS", "PRIVACY.md", "README.md")) {
            if (Test-Path $f) { Copy-Item $f $stage }
          }
          New-Item -ItemType Directory -Force -Path "out-artifacts" | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath "out-artifacts/Human2AI-v$version-windows-x64-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: out-artifacts/*.zip

  build-android:
    name: Android arm64 APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK & NDK (pre-installed runner SDK)
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          export PATH="$SDK_DIR/cmdline-tools/latest/bin:$SDK_DIR/platform-tools:$PATH"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" "ndk;28.2.13676358"
          echo "NDK_HOME=$SDK_DIR/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies & build Android APK via Tauri CLI
        run: |
          pnpm install --frozen-lockfile
          sed -i 's/\r$//' src-tauri/gen/android/gradlew
          chmod +x src-tauri/gen/android/gradlew
          pnpm tauri android build --apk true --target aarch64

      - name: Align & Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          UNSIGNED=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::Could not locate built release APK"
            exit 1
          fi
          mkdir -p out-artifacts
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"

          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" out-artifacts/aligned.apk

          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASS" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            ALIAS="${ANDROID_KEYSTORE_ALIAS:-human2ai}"
            KEY_PASS="${ANDROID_KEY_PASS:-$ANDROID_KEYSTORE_PASS}"
            "$BUILD_TOOLS/apksigner" sign \
              --ks release-keystore.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASS" \
              --key-pass "pass:$KEY_PASS" \
              --out "out-artifacts/Human2AI-v${VERSION}-android-arm64.apk" \
              out-artifacts/aligned.apk
            "$BUILD_TOOLS/apksigner" verify --print-certs "out-artifacts/Human2AI-v${VERSION}-android-arm64.apk"
            rm -f release-keystore.jks out-artifacts/aligned.apk out-artifacts/*.idsig
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; uploading unsigned APK."
            mv out-artifacts/aligned.apk "out-artifacts/Human2AI-v${VERSION}-android-arm64-unsigned.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out-artifacts/*.apk

  publish-release:
    name: Create Draft GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release-assets/*
